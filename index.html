<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Discord Tools</title>

    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kiwi+Maru&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1e1e2f;
            font-family: 'Kiwi Maru', 'Segoe UI', sans-serif;
            padding: 2rem 1rem;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== ヘッダー ===== */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header .logo {
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 3rem;
            color: #ffb3c6;
            letter-spacing: 4px;
            margin-bottom: 0.25rem;
        }
        .header .logo .accent {
            color: #7bed9f;
        }
        .header p {
            color: #aaa;
            font-size: 1.1rem;
        }
        .header .badge {
            display: inline-block;
            background: #ffb3c6;
            color: #1e1e2f;
            padding: 0.2rem 1.2rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: 'Mochiy Pop One', sans-serif;
            margin-top: 0.5rem;
        }

        /* ===== ツールグリッド ===== */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .tool-card {
            background: #2d2d44;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #444;
            transition: all 0.3s;
            text-decoration: none;
            color: #eee;
            display: block;
            position: relative;
            overflow: hidden;
        }
        .tool-card:hover {
            border-color: #ffb3c6;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 179, 198, 0.15);
        }
        .tool-card .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .tool-card .name {
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 1.1rem;
            color: #ffb3c6;
            margin-bottom: 0.25rem;
        }
        .tool-card .desc {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.5;
        }
        .tool-card .status {
            display: inline-block;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 12px;
            margin-top: 0.75rem;
            font-family: 'Mochiy Pop One', sans-serif;
        }
        .tool-card .status.public {
            background: #7bed9f;
            color: #1e1e2f;
        }
        .tool-card .status.beta {
            background: #feca57;
            color: #1e1e2f;
        }
        .tool-card .status.soon {
            background: #555;
            color: #888;
        }
        .tool-card .coming-soon {
            opacity: 0.5;
            pointer-events: none;
        }
        .tool-card .coming-soon .status {
            background: #555;
            color: #888;
        }

        /* ===== フッター ===== */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #555;
            border-top: 1px solid #333;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }
        .footer a {
            color: #ffb3c6;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer .social {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .footer .social a {
            color: #666;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .footer .social a:hover {
            color: #ffb3c6;
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 640px) {
            .header .logo {
                font-size: 2.2rem;
            }
            .tool-grid {
                grid-template-columns: 1fr;
            }
            .header p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ヘッダー ===== -->
        <div class="header">
            <div class="logo">Discord<span class="accent">Tools</span></div>
            <p>めじこんさばのつーる</p>
            <span class="badge">2 Tools Available</span>
        </div>

        <!-- ===== ツールグリッド ===== -->
        <div class="tool-grid">

            <!-- 2. Token Checker -->
            <a href="https://99399.github.io/discord-token-checker/" class="tool-card">
                <div class="name">Token Checker</div>
                <div class="desc">TOkenが生きてるかを確認</div>
                <span class="status public">公開中</span>
            </a>

            <!-- 3. Profile Viewer -->
            <a href="https://99399.github.io/profile-viewer/" class="tool-card">
                <div class="name">Token Manager</div>
                <div class="desc">複数Tokenを管理、Tokenからプロフィールを表示</div>
                <span class="status public">公開中</span>
            </a>

            <!-- 8. 準備中（Coming Soon） -->
            <div class="tool-card coming-soon">
                <div class="name">More Tools</div>
                <div class="desc">たぶんなんかつくる</div>
                <span class="status soon">準備中</span>
            </div>

        </div>

        <!-- ===== フッター ===== -->
        <div class="footer">
            <div>DiscordTools &copy; 2025</div>
            <div class="social">
                <a href="https://github.com/99399" target="_blank">GitHub</a>
                <a href="https://discord.gg/medicon" target="_blank">Discord</a>
                <a href="#" style="color:#555;">Contact</a>
            </div>
            <div style="margin-top:0.5rem;font-size:0.65rem;color:#444;">
                Support Server .gg/medicon
            </div>
        </div>

    </div>

</body>
</html>
