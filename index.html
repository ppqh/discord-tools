<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Discord Tools</title>

    <!-- Google Fonts: モダンで整ったスタイリッシュなフォントに変更 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #181824;
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            padding: 2rem 1rem;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== ヘッダー ===== */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 2.8rem;
            color: #5865F2; /* Discordっぽく青紫系に調整 */
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }
        .header .logo .accent {
            color: #57F287;
        }
        .header p {
            color: #aaa;
            font-size: 1rem;
        }
        .header .badge {
            display: inline-block;
            background: rgba(88, 101, 242, 0.2);
            color: #5865F2;
            border: 1px solid rgba(88, 101, 242, 0.4);
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.75rem;
        }

        /* ===== ツールグリッド ===== */
        .tool-grid {
            display: grid;
            /* 固定幅で綺麗に整列させる設定 */
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .tool-card {
            background: #232433;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #33354a;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tool-card:hover {
            border-color: #5865F2;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .tool-card .name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        .tool-card .desc {
            font-size: 0.85rem;
            color: #99aab5;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .tool-card .status {
            display: inline-block;
            align-self: flex-start;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }
        .tool-card .status.public {
            background: rgba(87, 242, 135, 0.15);
            color: #57F287;
        }
        .tool-card .status.soon {
            background: rgba(255, 255, 255, 0.05);
            color: #72767d;
        }
        .tool-card.coming-soon {
            opacity: 0.6;
            pointer-events: none;
        }

        /* ===== フッター ===== */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #72767d;
            border-top: 1px solid #2d2f45;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }
        .footer a {
            color: #5865F2;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer .social {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .footer .social a {
            color: #99aab5;
            font-size: 0.85rem;
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 640px) {
            .header .logo {
                font-size: 2.2rem;
            }
            .tool-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ヘッダー ===== -->
        <div class="header">
            <div class="logo">Discord<span class="accent">Tools</span></div>
            <p>めじこんさばのつーる</p>
            <span class="badge">2 Tools Available</span>
        </div>

        <!-- ===== ツールグリッド ===== -->
        <div class="tool-grid">

            <a href="https://99399.github.io/discord-token-checker/" class="tool-card">
                <div>
                    <div class="name">Token Checker</div>
                    <div class="desc">Tokenが生きてるかを確認</div>
                </div>
                <span class="status public">公開中</span>
            </a>

            <a href="https://99399.github.io/profile-viewer/" class="tool-card">
                <div>
                    <div class="name">Token Manager</div>
                    <div class="desc">複数Tokenを管理、Tokenからプロフィールを表示</div>
                </div>
                <span class="status public">公開中</span>
            </a>

            <a href="https://ppqh.github.io/oni/" class="tool-card">
                <div>
                    <div class="name">おにさんがおーｗ</div>
                    <div class="desc">おにさんがだいすきなひとにおすすめ</div>
                </div>
                <span class="status public">公開中</span>
            </a>

            <a href="https://ppqh.github.io/map/" class="tool-card">
                <div>
                    <div class="name">地図</div>
                    <div class="desc">なんとなく作っただけの地図のサイト</div>
                </div>
                <span class="status public">公開中</span>
            </a>

            <div class="tool-card coming-soon">
                <div>
                    <div class="name">More Tools</div>
                    <div class="desc">たぶんなんかつくる</div>
                </div>
                <span class="status soon">準備中</span>
            </div>

        </div>

        <!-- ===== フッター ===== -->
        <div class="footer">
            <div>dev by @7724(discord)</div>
            <div class="social">
                <a href="https://discord.gg/medicon" target="_blank">Discord</a>
                <a href="#" style="color:#72767d;">Contact</a>
            </div>
            <div style="margin-top:0.5rem;font-size:0.65rem;color:#555;">
                Support Server .gg/medicon
            </div>
        </div>

    </div>

</body>
</html>
